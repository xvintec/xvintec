name: Remote Deploy Next.js on Push

on:
  push:
    branches:
      - homepage-v2  # Triggers when you save changes to this branch

jobs:
  deploy:
    # 💡 FIX 1: Pin to ubuntu-24.04 to avoid unexpected breaking changes during the Ubuntu 26 migration
    runs-on: ubuntu-24.04
    
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Executing remote SSH commands to deploy
        # 💡 FIX 2: Upgraded from v1.0.3 to v1.2.0 to fully support GitHub's updated Node.js runtime
        uses: appleboy/ssh-action@v1.2.0
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          CONTACT_TO_EMAIL: ${{ secrets.CONTACT_TO_EMAIL }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 20m
          # Contact form SMTP settings, forwarded from the repo's Actions secrets
          envs: SMTP_HOST,SMTP_PORT,SMTP_USER,SMTP_PASS,CONTACT_TO_EMAIL
          script: |
            # Stop at the first failing command so a broken deploy fails the run
            # instead of silently rebuilding and reloading the old code.
            set -e

            # 1. Navigate to your specific subfolder
            cd /var/www/html/
            
            # 2. Discard lockfile/build-cache edits made by earlier deploys (they
            #    block the pull), then pull the newest changes from your branch
            git checkout -- package-lock.json yarn.lock
            if git ls-files --error-unmatch tsconfig.tsbuildinfo >/dev/null 2>&1; then
              git checkout -- tsconfig.tsbuildinfo
            fi
            git pull origin homepage-v2

            # 2b. Write the contact form settings for `next start` to load
            umask 077
            printf '%s\n' \
              "SMTP_HOST=$SMTP_HOST" \
              "SMTP_PORT=$SMTP_PORT" \
              "SMTP_USER=$SMTP_USER" \
              "SMTP_PASS=$SMTP_PASS" \
              "CONTACT_TO_EMAIL=$CONTACT_TO_EMAIL" > .env.production
            umask 022
            
            # 3. Load Node/NVM environment
            export NVM_DIR="$HOME/.nvm"
            set +e # nvm.sh isn't safe to source under `set -e`
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            set -e
            
            # 4. Install exactly what the lockfile pins (`npm ci` never rewrites it)
            npm ci
            
            # 5. Build the production build
            npm run build
            
            # 6. Smoothly reload the production PM2 instance
            pm2 reload xvintec
            pm2 save
